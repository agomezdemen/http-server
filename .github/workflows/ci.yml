name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Prototype build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes catch2 g++-16
          g++-16 --version

      - name: Configure
        env:
          CXX: g++-16
        run: cmake --preset prototype

      - name: Build
        run: cmake --build --preset prototype --parallel

      - name: Run tests
        run: ctest --preset prototype --output-on-failure
